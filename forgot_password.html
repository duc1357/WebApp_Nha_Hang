<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khôi phục mật khẩu tài khoản Nhà Hàng Cơm Quê Dượng Bầu để tiếp tục sử dụng các dịch vụ đặt bàn và ưu đãi.">
    <meta property="og:title" content="Quên mật khẩu - Nhà Hàng Cơm Quê Dượng Bầu">
    <meta property="og:description" content="Khôi phục mật khẩu tài khoản Nhà Hàng Cơm Quê Dượng Bầu.">
    <meta property="og:type" content="website">
    <title>Quên mật khẩu - Nhà Hàng Cơm Quê Dượng Bầu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --secondary: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="alertMsg" class="alert"></div>

        <!-- STEP 1: SEND OTP -->
        <div id="step1" class="step active">
            <h2>Quên mật khẩu</h2>
            <p style="margin-bottom:15px;color:#666;text-align:center;">Nhập email để nhận mã xác thực.</p>
            <div class="form-group">
                <label for="email">Email đăng ký</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            <button onclick="sendOtp()" id="btnSend">Gửi mã OTP</button>
            <a href="login.html" class="back-link">Quay lại đăng nhập</a>
        </div>

        <!-- STEP 2: VERIFY OTP -->
        <div id="step2" class="step">
            <h2>Xác thực OTP</h2>
            <p style="margin-bottom:15px;color:#666;text-align:center;">Mã OTP đã được gửi đến email của bạn.</p>
            <div class="form-group">
                <label for="otp">Mã xác thực (6 số)</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6"
                    style="text-align:center;letter-spacing:4px;font-size:18px;">
            </div>
            <button onclick="verifyOtp()" id="btnVerify">Xác nhận</button>
            <div style="text-align:center;margin-top:10px;">
                <a href="#" onclick="showStep(1); return false;" style="font-size:13px;color:#666;">Nhập lại Email</a>
            </div>
        </div>

        <!-- STEP 3: RESET PASSWORD -->
        <div id="step3" class="step">
            <h2>Đặt lại mật khẩu</h2>
            <div class="form-group">
                <label for="newPass">Mật khẩu mới</label>
                <input type="password" id="newPass" placeholder="******">
            </div>
            <div class="form-group">
                <label for="confirmPass">Nhập lại mật khẩu</label>
                <input type="password" id="confirmPass" placeholder="******">
            </div>
            <button onclick="resetPassword()" id="btnReset">Đổi mật khẩu</button>
        </div>

        <!-- STEP 4: SUCCESS -->
        <div id="step4" class="step">
            <h2 style="color:#27ae60">Thành công!</h2>
            <p style="text-align:center;margin-bottom:20px;">Mật khẩu của bạn đã được thay đổi.</p>
            <button onclick="location.href='login.html'">Đăng nhập ngay</button>
        </div>
    </div>

    <!-- <script src="js/main.js"></script> -->
    <script>
        // Init CSRF for standalone page
        let csrfToken = '';
        (async function initCsrf() {
            try {
                const res = await fetch('api/auth/get_csrf.php');
                const data = await res.json();
                if (data.success) {
                    csrfToken = data.csrf_token;
                }
            } catch (e) {
                console.error('CSRF Init fail', e);
            }
        })();

        // Global Fetch Wrapper
        const originalFetch = window.fetch;
        window.fetch = async function (url, options = {}) {
            if (options.method && ['POST', 'PUT', 'DELETE'].includes(options.method.toUpperCase())) {
                if (!options.headers) options.headers = {};
                if (options.headers instanceof Headers) {
                    options.headers.append('X-CSRF-Token', csrfToken);
                } else {
                    options.headers['X-CSRF-Token'] = csrfToken;
                }
            }
            return originalFetch(url, options);
        };
    </script>
    <script>
        let currentEmail = '';
        let confirmedOtp = '';

        function showMsg(msg, type) {
            const el = document.getElementById('alertMsg');
            el.className = `alert alert-${type}`;
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
            document.getElementById('alertMsg').style.display = 'none';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.dataset.text = btn.textContent;
                btn.textContent = 'Đang xử lý...';
                btn.disabled = true;
            } else {
                btn.textContent = btn.dataset.text;
                btn.disabled = false;
            }
        }

        // 1. Send OTP
        async function sendOtp() {
            const email = document.getElementById('email').value.trim();
            if (!email) return showMsg('Vui lòng nhập email', 'danger');

            setLoading('btnSend', true);

            try {
                const res = await fetch('api/auth/send_otp.php', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    currentEmail = email;
                    showStep(2);
                } else {
                    showMsg(data.message, 'danger');
                }
            } catch (e) {
                showMsg('Lỗi kết nối server', 'danger');
            } finally {
                setLoading('btnSend', false);
            }
        }

        // 2. Verify OTP
        async function verifyOtp() {
            const otp = document.getElementById('otp').value.trim();
            if (otp.length < 6) return showMsg('Nhập OTP 6 số', 'danger');

            setLoading('btnVerify', true);

            try {
                const res = await fetch('api/auth/verify_otp.php', {
                    method: 'POST',
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await res.json();

                if (data.success) {
                    confirmedOtp = otp;
                    showStep(3);
                } else {
                    showMsg(data.message, 'danger');
                }
            } catch (e) {
                showMsg('Lỗi kết nối', 'danger');
            } finally {
                setLoading('btnVerify', false);
            }
        }

        // 3. Reset Password
        async function resetPassword() {
            const p1 = document.getElementById('newPass').value;
            const p2 = document.getElementById('confirmPass').value;

            if (p1.length < 6) return showMsg('Mật khẩu tối thiểu 6 ký tự', 'danger');
            if (p1 !== p2) return showMsg('Mật khẩu không khớp', 'danger');

            setLoading('btnReset', true);

            try {
                const res = await fetch('api/auth/reset_password.php', {
                    method: 'POST',
                    body: JSON.stringify({ email: currentEmail, otp: confirmedOtp, password: p1 })
                });
                const data = await res.json();

                if (data.success) {
                    showStep(4);
                } else {
                    showMsg(data.message, 'danger');
                }
            } catch (e) {
                showMsg('Lỗi kết nối', 'danger');
            } finally {
                setLoading('btnReset', false);
            }
        }
    </script>

</body>

</html>
