<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Khôi phục mật khẩu tài khoản Nhà Hàng Cơm Quê Dượng Bầu để tiếp tục sử dụng các dịch vụ đặt bàn và ưu đãi.">
    <meta property="og:title" content="Quên mật khẩu - Nhà Hàng Cơm Quê Dượng Bầu">
    <meta property="og:description" content="Khôi phục mật khẩu tài khoản Nhà Hàng Cơm Quê Dượng Bầu.">
    <meta property="og:type" content="website">
    <title>Quên mật khẩu - Nhà Hàng Cơm Quê Dượng Bầu</title>
    <link rel="icon" href="photo/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --secondary: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-wrapper {
            width: min(100% - 32px, 980px);
            padding: 16px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: var(--secondary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 767px) {
            .auth-wrapper {
                width: min(100% - 24px, 460px);
                padding-block: 24px;
            }

            .auth-card {
                width: 100%;
                border-radius: 18px;
            }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body class="auth-page">

    <main class="auth-wrapper">
    <div class="container auth-card">
        <div id="alertMsg" class="alert"></div>

        <!-- STEP 1: SEND OTP -->
        <div id="step1" class="step active">
            <h2>Quên mật khẩu</h2>
            <p style="margin-bottom:15px;color:#666;text-align:center;">Nhập email để nhận mã xác thực.</p>
            <div class="form-group">
                <label for="email">Email đăng ký</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            <button type="button" id="btnSend">Gửi mã OTP</button>
            <a href="login.html" class="back-link">Quay lại đăng nhập</a>
        </div>

        <!-- STEP 2: VERIFY OTP -->
        <div id="step2" class="step">
            <h2>Xác thực OTP</h2>
            <p style="margin-bottom:15px;color:#666;text-align:center;">Mã OTP đã được gửi đến email của bạn.</p>
            <div class="form-group">
                <label for="otp">Mã xác thực (6 số)</label>
                <input type="text" id="otp" placeholder="123456" maxlength="6"
                    style="text-align:center;letter-spacing:4px;font-size:18px;">
            </div>
            <button type="button" id="btnVerify">Xác nhận</button>
            <div style="text-align:center;margin-top:10px;">
                <a href="#" id="btnBackToEmail" style="font-size:13px;color:#666;">Nhập lại Email</a>
            </div>
        </div>

        <!-- STEP 3: RESET PASSWORD -->
        <div id="step3" class="step">
            <h2>Đặt lại mật khẩu</h2>
            <div class="form-group">
                <label for="newPass">Mật khẩu mới</label>
                <input type="password" id="newPass" placeholder="******">
            </div>
            <div class="form-group">
                <label for="confirmPass">Nhập lại mật khẩu</label>
                <input type="password" id="confirmPass" placeholder="******">
            </div>
            <button type="button" id="btnReset">Đổi mật khẩu</button>
        </div>

        <!-- STEP 4: SUCCESS -->
        <div id="step4" class="step">
            <h2 style="color:#27ae60">Thành công!</h2>
            <p style="text-align:center;margin-bottom:20px;">Mật khẩu của bạn đã được thay đổi.</p>
            <button type="button" id="btnGoLogin">Đăng nhập ngay</button>
        </div>
    </div>
    </main>

    <script src="js/forgot-password.js" defer></script>

</body>

</html>
