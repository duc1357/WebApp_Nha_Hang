<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hồ sơ cá nhân và lịch sử đặt bàn, đơn hàng tại Nhà Hàng Cơm Quê Dượng Bầu.">
    <meta property="og:title" content="Hồ Sơ Của Tôi - Nhà Hàng Cơm Quê Dượng Bầu">
    <meta property="og:description" content="Quản lý hồ sơ cá nhân và theo dõi lịch sử đơn hàng tại Cơm Quê Dượng Bầu.">
    <meta property="og:type" content="profile">
    <title>Hồ Sơ Của Tôi - Nhà Hàng Cơm Quê Dượng Bầu</title>
    <link rel="icon" href="photo/favicon.png" type="image/png">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="style.css?v=16">
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d35400;
            --primary-dark: #b04300;
            --primary-gradient: linear-gradient(135deg, #e67e22, #c0392b);
            --charcoal: #1c1a17;
            --charcoal-light: #2c2823;
            --cream: #fbf9f6;
            --cream-dark: #f3ede2;
            --text-dark: #2c2823;
            --text-muted: #7d7265;
            --white: #ffffff;
            --accent-gold: #d4af37;
            --shadow-premium: 0 20px 50px rgba(28, 25, 23, 0.05);
            --shadow-premium-hover: 0 30px 60px rgba(28, 25, 23, 0.1);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Dark Theme overrides */
        html[data-theme="dark"] {
            --cream: #12100e;
            --cream-dark: #24201c;
            --text-dark: #f3ede2;
            --text-muted: #a09587;
            --white: #1c1916;
            --charcoal: #fbf9f6;
            --charcoal-light: #f3ede2;
            --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.4);
            --shadow-premium-hover: 0 30px 60px rgba(0, 0, 0, 0.55);
            --border-theme: rgba(211, 84, 0, 0.12);
        }

        /* Theme toggle button styling */
        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            outline: none;
            padding: 0;
            z-index: 100;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: var(--white);
            transform: scale(1.06);
            border-color: rgba(211, 84, 0, 0.3);
        }

        html[data-theme="dark"] .theme-toggle-btn .sun-icon {
            display: block;
        }
        html[data-theme="dark"] .theme-toggle-btn .moon-icon {
            display: none;
        }

        html:not([data-theme="dark"]) .theme-toggle-btn .sun-icon {
            display: none;
        }
        html:not([data-theme="dark"]) .theme-toggle-btn .moon-icon {
            display: block;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--cream) !important;
            color: var(--text-dark) !important;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* PREMIUM FLOATING STICKY NAVIGATION */
        nav.main-nav.glass-nav {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: min(92%, 1160px);
            max-width: none;
            margin: 0;
            padding: 12px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(28, 25, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        nav.main-nav.glass-nav:hover {
            background: rgba(28, 25, 23, 0.92);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(211, 84, 0, 0.2);
        }

        nav.main-nav.glass-nav a {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 20px;
            border-radius: 99px;
            transition: var(--transition);
            min-height: auto;
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        nav.main-nav.glass-nav a:hover,
        nav.main-nav.glass-nav a.active {
            color: var(--white);
            background: rgba(255, 255, 255, 0.08);
        }

        nav.main-nav.glass-nav .nav-brand {
            padding: 0;
            background: transparent !important;
            display: flex;
            align-items: center;
        }

        nav.main-nav.glass-nav .nav-brand:hover {
            transform: scale(1.05);
        }

        .nav-logo-img {
            height: 46px;
            width: 46px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            border: 2px solid var(--accent-gold);
            object-fit: cover;
            transition: var(--transition);
        }

        .nav-auth {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-auth .auth-user {
            color: #f3ede2;
            font-weight: 600;
            font-size: 14.5px;
        }

        .nav-auth .auth-btn {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 99px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-auth .auth-btn.secondary {
            background: var(--primary-gradient);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.25);
        }

        .nav-auth .auth-btn.secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(211, 84, 0, 0.35);
        }

        /* BRANDED HERO STYLING */
        .profile-hero {
            height: 45vh;
            min-height: 320px;
            background-image: 
                linear-gradient(rgba(28, 25, 23, 0.5), rgba(28, 25, 23, 0.75)),
                url('photo/luxury_bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 0;
        }

        .profile-hero::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, rgba(251, 249, 246, 0) 0%, var(--cream) 100%);
            pointer-events: none;
            z-index: 1;
            transition: background 0.4s ease;
        }

        html[data-theme="dark"] .profile-hero::before {
            background: linear-gradient(180deg, rgba(18, 16, 14, 0) 0%, var(--cream) 100%) !important;
        }

        /* PROFILE LAYOUT */
        .profile-container {
            max-width: 1200px;
            margin: 0 auto 80px;
            display: flex;
            gap: 30px;
            padding: 0 16px;
            position: relative;
            z-index: 10;
            margin-top: 25vh; /* Overlap the hero section */
        }

        /* SIDEBAR CARD */
        .profile-sidebar {
            flex: 0 0 320px;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium);
            border: 1px solid rgba(211, 84, 0, 0.06);
            overflow: hidden;
            position: sticky;
            top: 100px;
            transition: var(--transition);
        }

        .profile-sidebar:hover {
            box-shadow: var(--shadow-premium-hover);
        }

        .user-card {
            padding: 40px 24px 30px;
            text-align: center;
            border-bottom: 1px solid var(--cream-dark);
            background: linear-gradient(to bottom, var(--white), var(--cream));
        }

        .avatar-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 18px;
            position: relative;
            box-shadow: 0 8px 25px rgba(211, 84, 0, 0.25);
            border: 4px solid var(--white);
            background: var(--white);
            transition: var(--transition);
        }

        .avatar-preview:hover {
            transform: scale(1.05);
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-gradient);
            color: var(--white);
            border: 2px solid var(--white);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: var(--transition);
        }

        .avatar-upload-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 14px rgba(211, 84, 0, 0.3);
        }

        .user-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.45rem;
            color: var(--charcoal);
            font-weight: 700;
            margin: 12px 0 6px;
        }

        .member-badge {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: var(--white);
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
            margin-bottom: 8px;
        }

        .sidebar-menu {
            padding: 16px;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 8px;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-align: left;
            transition: var(--transition);
            font-family: inherit;
        }

        .sidebar-btn:hover {
            background: rgba(211, 84, 0, 0.05);
            color: var(--primary);
            transform: translateX(4px);
        }

        .sidebar-btn.active {
            background: var(--primary-gradient);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.2);
        }

        .logout-btn {
            color: #e74c3c !important;
            margin-top: 15px;
            border-top: 1px solid var(--cream-dark);
            padding-top: 20px;
            border-radius: 0;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.06) !important;
            color: #c0392b !important;
            transform: none;
        }

        /* CONTENT CARD */
        .profile-content {
            flex: 1;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium);
            border: 1px solid rgba(211, 84, 0, 0.06);
            padding: 48px;
            min-height: 600px;
            position: relative;
            transition: var(--transition);
        }

        .profile-content:hover {
            box-shadow: var(--shadow-premium-hover);
        }

        .tab-pane {
            display: none;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-header {
            border-bottom: 2px solid var(--cream-dark);
            padding-bottom: 16px;
            margin-bottom: 32px;
        }

        .content-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.65rem;
            color: var(--charcoal);
            margin: 0;
            font-weight: 700;
        }

        /* SUMMARY GRID */
        .profile-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .profile-summary-card {
            padding: 18px 24px;
            border: 1px solid var(--cream-dark);
            border-radius: var(--radius-sm);
            background: var(--cream);
            transition: var(--transition);
        }

        .profile-summary-card:hover {
            border-color: var(--primary);
            background: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(28, 25, 23, 0.02);
        }

        .profile-summary-card span {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-summary-card strong {
            display: block;
            color: var(--charcoal);
            font-size: 15px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        /* FORMS */
        .premium-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .premium-form .form-group:first-child,
        .premium-form .btn-save {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            height: 52px;
            padding: 0 18px;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--cream-dark);
            background-color: var(--cream);
            color: var(--text-dark);
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background-color: var(--white);
            box-shadow: 0 0 0 4px rgba(211, 84, 0, 0.08);
        }

        .btn-save {
            height: 52px;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            padding: 0 32px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            align-self: flex-start;
            margin-top: 12px;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.2);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(211, 84, 0, 0.35);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-save.btn-danger {
            background: var(--primary-gradient);
        }

        /* HISTORY LISTS & PAGINATION */
        .history-item {
            border: 1px solid var(--cream-dark) !important;
            padding: 20px 24px !important;
            margin-bottom: 16px !important;
            border-radius: var(--radius-sm) !important;
            background: var(--white);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            transition: var(--transition);
        }

        .history-item:hover {
            border-color: var(--primary) !important;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(28, 25, 23, 0.03);
        }

        .history-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            grid-column: 1 / -1;
        }

        .history-topline strong {
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            color: var(--charcoal);
        }

        .history-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.4;
        }

        .history-meta strong {
            color: var(--primary);
            font-weight: 700;
        }

        .history-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
        }

        .profile-action-btn {
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            height: 38px;
            padding: 0 16px;
            transition: var(--transition);
        }

        .profile-action-btn.primary {
            background: var(--primary-gradient);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(211, 84, 0, 0.15);
        }

        .profile-action-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(211, 84, 0, 0.25);
        }

        .profile-action-btn.success {
            background: #2ecc71;
            color: var(--white);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }

        .profile-action-btn.success:hover {
            background: #27ae60;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(46, 204, 113, 0.3);
        }

        .profile-action-btn.muted {
            background: var(--cream);
            color: var(--text-muted);
            cursor: not-allowed;
            border: 1px solid var(--cream-dark);
        }

        /* PAGINATION */
        .premium-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 32px;
        }

        .btn-page {
            background: var(--white);
            border: 1px solid var(--cream-dark);
            color: var(--text-dark);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-page:hover:not([disabled]) {
            border-color: var(--primary);
            background: rgba(211, 84, 0, 0.05);
            color: var(--primary);
        }

        .btn-page[disabled] {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .page-info .current {
            color: var(--primary);
        }

        /* BADGES */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 26px;
            padding: 0 12px;
            font-size: 11.5px;
            font-weight: 800;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }

        .badge-warning {
            background: rgba(241, 196, 15, 0.1);
            color: #f1c40f;
        }

        .badge-danger {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }

        /* MODALS DESIGN */
        .modal {
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            transition: var(--transition) !important;
        }

        .modal-content {
            background: var(--white) !important;
            border: 1px solid rgba(211, 84, 0, 0.08) !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35) !important;
            color: var(--text-dark) !important;
            border-radius: var(--radius-lg) !important;
        }

        .modal-content h3 {
            font-family: 'Playfair Display', serif !important;
            font-size: 22px !important;
            color: var(--charcoal) !important;
            font-weight: 700 !important;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .profile-container {
                flex-direction: column;
                margin-top: 18vh;
            }
            .profile-sidebar {
                flex: none;
                width: 100%;
                position: static;
            }
            .profile-content {
                padding: 30px 24px;
            }
        }

        @media (max-width: 576px) {
            .profile-content {
                padding: 24px 16px;
            }
            .premium-form {
                grid-template-columns: 1fr;
            }
            .history-item {
                grid-template-columns: 1fr;
                padding: 16px !important;
            }
            .history-actions {
                justify-content: flex-start;
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>
    <!-- HERO BACKGROUND -->
    <div class="profile-hero"></div>

    <!-- PREMIUM STICKY GLASS NAVIGATION -->
    <nav class="main-nav glass-nav" data-static-user-header="true">
        <a href="index.html" class="nav-brand">
            <img src="photo/favicon.png" alt="Nhà Hàng Cơm Quê Dượng Bầu" class="nav-logo-img">
        </a>
        <a href="index.html#menu">Thực Đơn</a>
        <a href="booking.html">Đặt Bàn</a>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Chuyển đổi giao diện sáng tối">
            <!-- Sun Icon -->
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="18.36" x2="5.64" y2="19.78"></line><line x1="18.36" y1="4.22" x2="19.78" y2="5.64"></line></svg>
            <!-- Moon Icon -->
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <div id="auth-actions" class="nav-auth"></div>
    </nav>

    <!-- MAIN PROFILE CONTAINER -->
    <div class="profile-container">
        
        <!-- SIDEBAR -->
        <div class="profile-sidebar">
            <div class="user-card">
                <div class="avatar-preview">
                    <img id="profile-avatar-img" src="photo/default-user.png" alt="Avatar">
                    
                    <input type="file" id="avatar-input" accept="image/*" style="display:none;" data-action="upload-avatar">
                    <button type="button" class="avatar-upload-btn" data-action="choose-avatar" title="Đổi ảnh đại diện">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </button>
                    
                    <div id="avatar-loading" style="position:absolute; inset:0; background:rgba(255,255,255,0.8); display:none; align-items:center; justify-content:center; border-radius: 50%;">
                        <span class="spinner" style="border-color:var(--primary); width:24px; height:24px;"></span>
                    </div>
                </div>
                
                <h2 class="user-name" id="display-user-name">Đang tải...</h2>
                <div class="member-badge">Thành Viên Vàng</div> <!-- Thẻ thành viên ảo -->
            </div>

            <div class="sidebar-menu">
                <button class="sidebar-btn active" data-tab="info">
                    <span style="margin-right: 12px;">👤</span> Thông tin tài khoản
                </button>
                <button class="sidebar-btn" data-tab="orders">
                    <span style="margin-right: 12px;">🛒</span> Lịch sử đơn hàng
                </button>
                <button class="sidebar-btn" data-tab="bookings">
                    <span style="margin-right: 12px;">📅</span> Lịch sử đặt bàn
                </button>
                <button class="sidebar-btn" data-tab="security">
                    <span style="margin-right: 12px;">🔒</span> Đổi mật khẩu
                </button>

                <button class="sidebar-btn logout-btn" data-action="logout-user">
                    <span style="margin-right: 12px;">🚪</span> Đăng xuất
                </button>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="profile-content">
            
            <!-- TAB: INFO -->
            <div id="tab-info" class="tab-pane active">
                <div class="content-header">
                    <h3>Cập Nhật Thông Tin</h3>
                </div>

                <div class="profile-summary-grid" aria-label="Tóm tắt tài khoản">
                    <div class="profile-summary-card">
                        <span>Vai trò</span>
                        <strong id="profile-role">Khách hàng</strong>
                    </div>
                    <div class="profile-summary-card">
                        <span>Email</span>
                        <strong id="profile-email-summary">Chưa cập nhật</strong>
                    </div>
                    <div class="profile-summary-card">
                        <span>Điện thoại</span>
                        <strong id="profile-phone-summary">Chưa cập nhật</strong>
                    </div>
                </div>

                <form data-action="update-user-info" class="premium-form">
                    <div class="form-group">
                        <label for="u_name">Họ tên</label>
                        <input id="u_name" required placeholder="Nhập họ tên của bạn">
                    </div>

                    <div class="form-group">
                        <label for="u_email">Email</label>
                        <input id="u_email" type="email" placeholder="Nhập địa chỉ email">
                    </div>

                    <div class="form-group">
                        <label for="u_phone">Số điện thoại</label>
                        <input id="u_phone" required placeholder="Nhập số điện thoại liên lạc">
                    </div>

                    <button type="submit" class="btn-save">Lưu thay đổi</button>
                </form>
            </div>

            <!-- TAB: SECURITY -->
            <div id="tab-security" class="tab-pane">
                <div class="content-header">
                    <h3>Đổi Mật Khẩu</h3>
                </div>
                <form data-action="change-password" class="premium-form">
                    <div class="form-group">
                        <label for="old_pass">Mật khẩu cũ</label>
                        <input type="password" id="old_pass" required placeholder="Nhập mật khẩu hiện tại">
                    </div>

                    <div class="form-group">
                        <label for="new_pass">Mật khẩu mới</label>
                        <input type="password" id="new_pass" required minlength="8"
                            pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                            placeholder="Tối thiểu 8 ký tự, có chữ hoa và số">
                    </div>

                    <div class="form-group">
                        <label for="confirm_pass">Nhập lại mật khẩu mới</label>
                        <input type="password" id="confirm_pass" required minlength="8"
                            pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                            placeholder="Xác nhận mật khẩu mới">
                    </div>

                    <button type="submit" class="btn-save btn-danger">Đổi Mật Khẩu</button>
                </form>
            </div>

            <!-- TAB: ORDERS -->
            <div id="tab-orders" class="tab-pane">
                <div class="content-header">
                    <h3>Lịch Sử Đơn Hàng</h3>
                </div>
                <div id="order-history-list">Đang tải...</div>
            </div>

            <!-- TAB: BOOKINGS -->
            <div id="tab-bookings" class="tab-pane">
                <div class="content-header">
                    <h3>Lịch Sử Đặt Bàn</h3>
                </div>
                <div id="booking-history-list">Đang tải...</div>
            </div>
        </div>
    </div>

    <!-- REVIEW MODAL -->
    <div id="review-modal" class="modal profile-review-modal" style="display:none; position:fixed; z-index:1001; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="modal-content profile-review-panel" style="background-color:#fefefe; margin:auto; padding:30px; border-radius:20px; width:90%; max-width:450px; position:relative; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
            <h3 style="margin-top:0; color:var(--accent); font-size:1.4rem;">Đánh giá đơn hàng</h3>
            <input type="hidden" id="review-order-id">

            <div style="margin:25px 0; text-align:center;">
                <label style="display:block; margin-bottom:15px; font-weight:600; color:var(--text-light);">Trải nghiệm của bạn như thế nào?</label>
                <div class="star-rating" style="font-size:40px; color:#ddd; cursor:pointer; display:flex; justify-content:center; gap:5px;">
                    <span data-rating="1" data-value="1">★</span>
                    <span data-rating="2" data-value="2">★</span>
                    <span data-rating="3" data-value="3">★</span>
                    <span data-rating="4" data-value="4">★</span>
                    <span data-rating="5" data-value="5">★</span>
                </div>
                <input type="hidden" id="review-rating" value="0">
            </div>

            <div style="margin-bottom:25px;">
                <textarea id="review-comment" rows="4" placeholder="Hãy chia sẻ thêm cảm nhận của bạn (Tùy chọn)..." style="width:100%; padding:15px; border-radius:12px; border:2px solid #eee; font-family:inherit; font-size:1rem; resize:vertical;"></textarea>
            </div>

            <div style="text-align:right; gap:12px; display:flex; justify-content:flex-end;">
                <button data-action="close-review-modal" style="padding:12px 24px; background:#f0f0f0; border:none; border-radius:10px; cursor:pointer; font-weight:600; color:var(--text-main);">Để sau</button>
                <button data-action="submit-review" style="padding:12px 24px; background:var(--primary); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600; box-shadow:0 4px 10px rgba(230,126,34,0.3);">Gửi đánh giá</button>
            </div>
        </div>
    </div>

    <!-- ORDER DETAIL MODAL -->
    <div id="order-detail-modal" class="modal profile-order-modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5);">
        <div class="modal-content profile-order-panel" style="background-color:#fefefe; margin:10% auto; padding:30px; width:90%; max-width:600px; border-radius:20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #f0f0f0; padding-bottom:15px;">
                <h3 style="margin:0; color:var(--accent); font-size:1.4rem;">Đơn Hàng #<span id="modal-order-id"></span></h3>
                <span class="close" data-action="close-order-modal" style="font-size:28px; font-weight:bold; cursor:pointer; color:var(--text-light); transition:color 0.2s;">&times;</span>
            </div>
            <div id="modal-order-items">
                <!-- Items will be loaded here -->
                <div class="spinner"></div> Đang tải...
            </div>
            <div style="text-align:right; margin-top:25px; border-top:2px solid #f0f0f0; padding-top:20px;">
                <button data-action="close-order-modal" style="padding:12px 24px; background:#f0f0f0; border:none; border-radius:10px; cursor:pointer; font-weight:600; color:var(--text-main);">Đóng</button>
            </div>
        </div>
    </div>

    <!-- JS Modules (thứ tự nạp quan trọng: main → utils → payment → profile → reviews) -->
    <script src="js/main.js?v=5.0"></script>
    <script src="js/utils.js?v=3.0"></script>
    <script src="js/payment.js?v=3.0"></script>
    <script src="js/profile.js?v=3.0"></script>
    <script src="js/reviews.js?v=3.0"></script>

    
    <script src="js/profile-inline.js" defer></script>
</body>
</html>
