<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hồ sơ cá nhân và lịch sử đặt bàn, đơn hàng tại Nhà Hàng Cơm Quê Dượng Bầu.">
    <meta property="og:title" content="Hồ Sơ Của Tôi - Nhà Hàng Cơm Quê Dượng Bầu">
    <meta property="og:description" content="Quản lý hồ sơ cá nhân và theo dõi lịch sử đơn hàng tại Cơm Quê Dượng Bầu.">
    <meta property="og:type" content="profile">
    <title>Hồ Sơ Của Tôi - Nhà Hàng Cơm Quê Dượng Bầu</title>
    <link rel="icon" href="photo/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=16">
    <style>
        /* =========================================
           PREMIUM PROFILE STYLES
           ========================================= */
        body { background-color: var(--bg-body); }
        
        .profile-hero {
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.6) 0%, rgba(17, 24, 32, 0.8) 100%), url('photo/luxury_bg.png');
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 380px;
            z-index: 0;
        }

        .profile-nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 99px;
            width: 90%;
            max-width: 1000px;
            margin: 30px auto 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .profile-nav a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .profile-nav a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .profile-nav .nav-auth {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-nav .user-greeting {
            color: white !important;
            font-weight: 600;
        }

        .profile-container {
            max-width: 1100px;
            margin: 0 auto 60px;
            display: flex;
            gap: 30px;
            padding: 0 20px;
            align-items: flex-start;
            position: relative;
            z-index: 10;
        }

        /* SIDEBAR CARD */
        .profile-sidebar {
            flex: 0 0 300px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            position: sticky;
            top: 100px;
        }

        .user-card {
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            background: linear-gradient(to bottom, #fff, #fafafa);
        }

        .avatar-preview {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 15px;
            position: relative;
            box-shadow: 0 8px 25px rgba(230, 126, 34, 0.25);
            border: 4px solid white;
            background: white;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: white;
            border: 2px solid white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .avatar-upload-btn:hover { transform: scale(1.1); background: var(--primary-dark); }

        .user-name { font-size: 1.4rem; color: var(--accent); font-weight: 700; margin: 10px 0 5px; }
        
        .member-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
            margin-bottom: 10px;
        }

        .sidebar-menu { padding: 15px; }
        
        .sidebar-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 8px;
            background: transparent;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-light);
            text-align: left;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .sidebar-btn:hover { background: #f8f9fa; color: var(--accent); transform: translateX(5px); }
        
        .sidebar-btn.active {
            background: rgba(230, 126, 34, 0.08);
            color: var(--primary);
            box-shadow: inset 4px 0 0 var(--primary);
        }

        .logout-btn { 
            color: var(--danger); 
            margin-top: 10px; 
            border-top: 1px solid #f0f0f0; 
            padding-top: 20px; 
            border-radius: 0; 
        }
        .logout-btn:hover { background: rgba(192, 57, 43, 0.05); color: var(--danger); }

        /* CONTENT CARD */
        .profile-content {
            flex: 1;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 50px;
            min-height: 600px;
            position: relative;
        }

        .tab-pane { 
            display: none; 
            animation: slideUpFade 0.4s ease forwards;
        }
        .tab-pane.active { display: block; }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-header { border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 35px; }
        .content-header h3 { font-size: 1.6rem; color: var(--accent); margin: 0; }

        /* Lightweight UX refresh */
        .profile-hero {
            height: 300px;
            background:
                linear-gradient(135deg, rgba(32, 42, 54, 0.72) 0%, rgba(17, 24, 32, 0.88) 100%),
                url('photo/luxury_bg.png');
        }

        .profile-nav {
            max-width: 1120px;
            justify-content: space-between;
            gap: 18px;
            border-radius: 8px;
            padding: 12px 18px;
            margin-top: 24px;
            margin-bottom: 34px;
        }

        .profile-nav a {
            border-radius: 8px;
            white-space: nowrap;
        }

        .profile-container {
            max-width: 1180px;
            gap: 24px;
        }

        .profile-sidebar,
        .profile-content {
            border-radius: 8px;
            border: 1px solid rgba(44, 62, 80, 0.08);
            box-shadow: 0 16px 42px rgba(17, 24, 32, 0.08);
        }

        .profile-sidebar {
            flex-basis: 280px;
            top: 88px;
        }

        .user-card {
            padding: 32px 22px 24px;
        }

        .avatar-preview {
            width: 96px;
            height: 96px;
        }

        .member-badge {
            border-radius: 6px;
            letter-spacing: 0;
        }

        .sidebar-menu {
            padding: 12px;
        }

        .sidebar-btn {
            min-height: 48px;
            border-radius: 8px;
            margin-bottom: 6px;
            padding: 12px 14px;
            font-size: 0.98rem;
        }

        .sidebar-btn:hover {
            transform: none;
        }

        .profile-content {
            padding: 34px;
        }

        .content-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid #eceff3;
            margin-bottom: 24px;
        }

        .content-header h3 {
            font-size: 1.45rem;
        }

        .profile-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: -8px 0 28px;
        }

        .profile-summary-card {
            min-height: 82px;
            padding: 16px;
            border: 1px solid #edf0f2;
            border-radius: 8px;
            background: #fbfcfd;
        }

        .profile-summary-card span {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .profile-summary-card strong {
            display: block;
            color: var(--accent);
            font-size: 1rem;
            overflow-wrap: anywhere;
        }

        .premium-form {
            max-width: 720px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .premium-form .form-group:first-child,
        .premium-form .btn-save {
            grid-column: 1 / -1;
        }

        .form-group input {
            border-radius: 8px;
            padding: 14px 16px;
        }

        .btn-save {
            border-radius: 8px;
            min-height: 48px;
            margin-top: 4px;
        }

        .history-item {
            border: 1px solid #edf0f2 !important;
            padding: 18px !important;
            margin-bottom: 12px !important;
            border-radius: 8px !important;
            background: #fff;
        }

        .history-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .history-meta {
            display: grid;
            gap: 5px;
            margin: 0;
            color: var(--text-light);
        }

        .history-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .profile-action-btn {
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 700;
            min-height: 34px;
            padding: 7px 12px;
        }

        .profile-action-btn.primary {
            background: var(--primary);
            color: #fff;
        }

        .profile-action-btn.success {
            background: #2ecc71;
            color: #fff;
        }

        .profile-action-btn.muted {
            background: #eef1f3;
            color: var(--text-light);
            cursor: default;
        }

        /* FORMS */
        .premium-form { display: grid; gap: 24px; max-width: 600px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 600; color: var(--text-main); font-size: 0.95rem; }
        .form-group input { 
            padding: 16px 20px; 
            border: 2px solid #eee; 
            border-radius: 12px; 
            font-size: 1rem; 
            transition: all 0.3s ease; 
            background: #fafafa;
            font-family: inherit;
        }
        .form-group input:focus { 
            border-color: var(--primary); 
            background: white; 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1); 
        }
        
        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-start;
            margin-top: 10px;
            font-family: inherit;
        }
        .btn-save:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230, 126, 34, 0.3); }
        
        .btn-danger { background: var(--text-main); }
        .btn-danger:hover { background: var(--accent); box-shadow: 0 6px 20px rgba(44, 62, 80, 0.3); }

        .premium-form {
            max-width: 720px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .premium-form .form-group:first-child,
        .premium-form .btn-save {
            grid-column: 1 / -1;
        }

        .form-group input {
            border-radius: 8px;
            padding: 14px 16px;
        }

        .btn-save {
            border-radius: 8px;
            min-height: 48px;
            margin-top: 4px;
        }

        /* Modals & History Lists remain styled by style.css */
        
        @media (max-width: 768px) {
            .profile-nav { overflow-x: auto; justify-content: flex-start; width: calc(100% - 28px); }
            .profile-container { flex-direction: column; margin-top: -18px; padding: 0 14px; }
            .profile-sidebar { flex: none; width: 100%; position: static; }
            .profile-content { padding: 24px 16px; }
            .profile-summary-grid { grid-template-columns: 1fr; }
            .premium-form { grid-template-columns: 1fr; }
            .profile-hero { padding: 20px 20px 60px; }
            .history-topline { align-items: flex-start; flex-direction: column; }
            .history-actions { justify-content: flex-start; }
        }
    </style>
</head>

<body>
    <!-- HERO BACKGROUND -->
    <div class="profile-hero"></div>

    <!-- PREMIUM NAVIGATION -->
    <nav class="profile-nav">
        <a href="index.html" class="nav-brand">
            <img src="photo/favicon.png" alt="Nhà Hàng Cơm Quê Dượng Bầu" style="height: 48px; width: 48px; object-fit: cover; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: transform 0.3s ease;">
        </a>
        <a href="index.html#menu">Thực Đơn</a>
        <a href="booking.html">Đặt Bàn</a>
        <div id="auth-actions" class="nav-auth"></div>
    </nav>

    <!-- MAIN PROFILE CONTAINER -->
    <div class="profile-container">
        
        <!-- SIDEBAR -->
        <div class="profile-sidebar">
            <div class="user-card">
                <div class="avatar-preview">
                    <img id="profile-avatar-img" src="photo/default-user.png" alt="Avatar">
                    
                    <input type="file" id="avatar-input" accept="image/*" style="display:none;" data-action="upload-avatar">
                    <button type="button" class="avatar-upload-btn" data-action="choose-avatar" title="Đổi ảnh đại diện">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    </button>
                    
                    <div id="avatar-loading" style="position:absolute; inset:0; background:rgba(255,255,255,0.8); display:none; align-items:center; justify-content:center; border-radius: 50%;">
                        <span class="spinner" style="border-color:var(--primary); width:24px; height:24px;"></span>
                    </div>
                </div>
                
                <h2 class="user-name" id="display-user-name">Đang tải...</h2>
                <div class="member-badge">Thành Viên Vàng</div> <!-- Thẻ thành viên ảo -->
            </div>

            <div class="sidebar-menu">
                <button class="sidebar-btn active" data-tab="info">
                    <span style="margin-right: 12px;">👤</span> Thông tin tài khoản
                </button>
                <button class="sidebar-btn" data-tab="orders">
                    <span style="margin-right: 12px;">🛒</span> Lịch sử đơn hàng
                </button>
                <button class="sidebar-btn" data-tab="bookings">
                    <span style="margin-right: 12px;">📅</span> Lịch sử đặt bàn
                </button>

                <button class="sidebar-btn logout-btn" data-action="logout-user">
                    <span style="margin-right: 12px;">🚪</span> Đăng xuất
                </button>
            </div>
        </div>

        <!-- CONTENT AREA -->
        <div class="profile-content">
            
            <!-- TAB: INFO -->
            <div id="tab-info" class="tab-pane active">
                <div class="content-header">
                    <h3>Cập Nhật Thông Tin</h3>
                </div>

                <div class="profile-summary-grid" aria-label="Tóm tắt tài khoản">
                    <div class="profile-summary-card">
                        <span>Vai trò</span>
                        <strong id="profile-role">Khách hàng</strong>
                    </div>
                    <div class="profile-summary-card">
                        <span>Email</span>
                        <strong id="profile-email-summary">Chưa cập nhật</strong>
                    </div>
                    <div class="profile-summary-card">
                        <span>Điện thoại</span>
                        <strong id="profile-phone-summary">Chưa cập nhật</strong>
                    </div>
                </div>

                <form data-action="update-user-info" class="premium-form">
                    <div class="form-group">
                        <label for="u_name">Họ tên</label>
                        <input id="u_name" required placeholder="Nhập họ tên của bạn">
                    </div>

                    <div class="form-group">
                        <label for="u_email">Email</label>
                        <input id="u_email" type="email" placeholder="Nhập địa chỉ email">
                    </div>

                    <div class="form-group">
                        <label for="u_phone">Số điện thoại</label>
                        <input id="u_phone" required placeholder="Nhập số điện thoại liên lạc">
                    </div>

                    <button type="submit" class="btn-save">Lưu thay đổi</button>
                </form>

                <div class="content-header" style="margin-top: 50px;">
                    <h3>Đổi Mật Khẩu</h3>
                </div>
                <form data-action="change-password" class="premium-form">
                    <div class="form-group">
                        <label for="old_pass">Mật khẩu cũ</label>
                        <input type="password" id="old_pass" required placeholder="Nhập mật khẩu hiện tại">
                    </div>

                    <div class="form-group">
                        <label for="new_pass">Mật khẩu mới</label>
                        <input type="password" id="new_pass" required minlength="8"
                            pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                            placeholder="Tối thiểu 8 ký tự, có chữ hoa và số">
                    </div>

                    <div class="form-group">
                        <label for="confirm_pass">Nhập lại mật khẩu mới</label>
                        <input type="password" id="confirm_pass" required minlength="8"
                            pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                            placeholder="Xác nhận mật khẩu mới">
                    </div>

                    <button type="submit" class="btn-save btn-danger">Đổi Mật Khẩu</button>
                </form>
            </div>

            <!-- TAB: ORDERS -->
            <div id="tab-orders" class="tab-pane">
                <div class="content-header">
                    <h3>Lịch Sử Đơn Hàng</h3>
                </div>
                <div id="order-history-list">Đang tải...</div>
            </div>

            <!-- TAB: BOOKINGS -->
            <div id="tab-bookings" class="tab-pane">
                <div class="content-header">
                    <h3>Lịch Sử Đặt Bàn</h3>
                </div>
                <div id="booking-history-list">Đang tải...</div>
            </div>
        </div>
    </div>

    <!-- REVIEW MODAL -->
    <div id="review-modal" class="modal profile-review-modal" style="display:none; position:fixed; z-index:1001; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="modal-content profile-review-panel" style="background-color:#fefefe; margin:auto; padding:30px; border-radius:20px; width:90%; max-width:450px; position:relative; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
            <h3 style="margin-top:0; color:var(--accent); font-size:1.4rem;">Đánh giá đơn hàng</h3>
            <input type="hidden" id="review-order-id">

            <div style="margin:25px 0; text-align:center;">
                <label style="display:block; margin-bottom:15px; font-weight:600; color:var(--text-light);">Trải nghiệm của bạn như thế nào?</label>
                <div class="star-rating" style="font-size:40px; color:#ddd; cursor:pointer; display:flex; justify-content:center; gap:5px;">
                    <span data-rating="1" data-value="1">★</span>
                    <span data-rating="2" data-value="2">★</span>
                    <span data-rating="3" data-value="3">★</span>
                    <span data-rating="4" data-value="4">★</span>
                    <span data-rating="5" data-value="5">★</span>
                </div>
                <input type="hidden" id="review-rating" value="0">
            </div>

            <div style="margin-bottom:25px;">
                <textarea id="review-comment" rows="4" placeholder="Hãy chia sẻ thêm cảm nhận của bạn (Tùy chọn)..." style="width:100%; padding:15px; border-radius:12px; border:2px solid #eee; font-family:inherit; font-size:1rem; resize:vertical;"></textarea>
            </div>

            <div style="text-align:right; gap:12px; display:flex; justify-content:flex-end;">
                <button data-action="close-review-modal" style="padding:12px 24px; background:#f0f0f0; border:none; border-radius:10px; cursor:pointer; font-weight:600; color:var(--text-main);">Để sau</button>
                <button data-action="submit-review" style="padding:12px 24px; background:var(--primary); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600; box-shadow:0 4px 10px rgba(230,126,34,0.3);">Gửi đánh giá</button>
            </div>
        </div>
    </div>

    <!-- ORDER DETAIL MODAL -->
    <div id="order-detail-modal" class="modal profile-order-modal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5);">
        <div class="modal-content profile-order-panel" style="background-color:#fefefe; margin:10% auto; padding:30px; width:90%; max-width:600px; border-radius:20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid #f0f0f0; padding-bottom:15px;">
                <h3 style="margin:0; color:var(--accent); font-size:1.4rem;">Đơn Hàng #<span id="modal-order-id"></span></h3>
                <span class="close" data-action="close-order-modal" style="font-size:28px; font-weight:bold; cursor:pointer; color:var(--text-light); transition:color 0.2s;">&times;</span>
            </div>
            <div id="modal-order-items">
                <!-- Items will be loaded here -->
                <div class="spinner"></div> Đang tải...
            </div>
            <div style="text-align:right; margin-top:25px; border-top:2px solid #f0f0f0; padding-top:20px;">
