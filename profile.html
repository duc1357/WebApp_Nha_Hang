<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý hồ sơ, lịch sử đặt bàn và theo dõi ưu đãi tại Nhà Hàng Cơm Quê Dượng Bầu.">
    <meta property="og:title" content="Hồ Sơ Của Tôi - Nhà Hàng Cơm Quê Dượng Bầu">
    <meta property="og:description" content="Quản lý hồ sơ cá nhân và lịch sử dịch vụ.">
    <meta property="og:type" content="website">
    <title>Hồ Sơ Của Tôi - Nhà Hàng Cơm Quê Dượng Bầu</title>
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .profile-wrapper {
            display: flex;
            gap: 20px;
            min-height: 400px;
        }

        /* Sticky Footer Fix */
        html,
        body {
            height: 100%;
            margin: 0;
        }

        .bg-overlay {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .profile-container {
            flex: 1;
            /* Push footer down */
            width: 100%;
            /* Fix width */
        }

        footer {
            margin-top: auto;
            width: 100%;
        }

        .profile-sidebar {
            flex: 0 0 250px;
            background: #f8f9fa;
            border-right: 1px solid #eee;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-content {
            flex: 1;
            padding: 20px;
        }

        .sidebar-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            border-left: 4px solid transparent;
            /* Indicator */
            font-weight: 500;
            color: #555;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .sidebar-btn:hover {
            background: #e9ecef;
            color: #e67e22;
        }

        .sidebar-btn.active {
            background: #fff3cd;
            color: #e67e22;
            border-left-color: #e67e22;
            font-weight: bold;
        }

        .profile-header {
            border-bottom: 2px solid #eee;
            margin-bottom: 0;
            padding: 20px;
        }

        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 0;
            /* Remove padding from main container, move to children */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Tab Logic */
        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .profile-wrapper {
                flex-direction: column;
            }

            .profile-sidebar {
                flex: none;
                border-right: none;
                border-bottom: 1px solid #eee;
            }
        }

        .profile-sidebar {
            flex: none;
            border-right: none;
            border-bottom: 1px solid #eee;
        }


        .pagination-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 5px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        .page-btn.active {
            background: #e67e22;
            color: white;
            border-color: #e67e22;
        }

        .page-btn:disabled {
            background: #eee;
            color: #aaa;
            cursor: not-allowed;
        }

        /* FIX: Remove conflicting legacy background from style.css */
        header::before {
            display: none !important;
            background: none !important;
        }

        header {
            background-color: transparent;
            /* Reset any global color */
        }
    </style>
</head>

<body>
    <div class="bg-overlay">

        <header
            style="background: url('photo/luxury_bg.png') center/cover no-repeat; padding: 40px 0; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative;">
            <div style="position: absolute; inset: 0; background: rgba(44, 62, 80, 0.5); z-index: 1;"></div>
            <!-- Refined overlay for better text contrast -->
            <h1 style="position: relative; z-index: 2; margin: 0;
                       font-family: 'Outfit', sans-serif;
                       font-size: 2.5rem;
                       font-weight: 800;
                       line-height: 1.2;
                       letter-spacing: 0.5px;
                       text-transform: uppercase;
                       background: linear-gradient(to right, #fff, #f39c12);
                       -webkit-background-clip: text;
                       background-clip: text;
                       -webkit-text-fill-color: transparent;
                       text-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                Nhà Hàng Cơm Quê Dượng Bầu
            </h1>
        </header>

        <div class="profile-container">
            <div class="profile-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Hồ Sơ Của Tôi</h2>
                <div style="display:flex; gap: 15px; align-items:center;">
                    <a href="index.html" class="back-btn">← Quay lại trang chủ</a>
                </div>
            </div>

            <div class="profile-wrapper">
                <!-- SIDEBAR NAVIGATION -->
                <div class="profile-sidebar">
                    <button class="sidebar-btn active" onclick="switchProfileTab('info')">Thông tin tài khoản</button>
                    <button class="sidebar-btn" onclick="switchProfileTab('orders')">Lịch sử đơn hàng</button>
                    <button class="sidebar-btn" onclick="switchProfileTab('bookings')">Lịch sử đặt bàn</button>

                    <div style="margin-top: auto; padding: 10px 20px; border-top: 1px solid #eee;">
                        <button onclick="logoutUser()"
                            style="width: 100%; background:#c0392b; color:white; border:none; padding: 10px; border-radius:4px; cursor:pointer;">Đăng
                            xuất</button>
                    </div>
                </div>

                <!-- CONTENT AREA -->
                <div class="profile-content">
                    <div id="tab-info" class="tab-pane active">
                        <h3 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">Cập Nhật Thông Tin
                        </h3>

                        <!-- AVATAR UPLOAD -->
                        <div class="avatar-section"
                            style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
                            <div class="avatar-preview"
                                style="width:80px; height:80px; border-radius:50%; overflow:hidden; border:2px solid #e67e22; position: relative;">
                                <img id="profile-avatar-img" src="photo/default-user.png"
                                    onerror="this.src='photo/default-user.png'" alt="Avatar"
                                    style="width:100%; height:100%; object-fit:cover;">
                                <div id="avatar-loading"
                                    style="position:absolute; inset:0; background:rgba(255,255,255,0.7); display:none; align-items:center; justify-content:center;">
                                    <span class="spinner" style="border-color:#e67e22; width:20px; height:20px;"></span>
                                </div>
                            </div>
                            <div>
                                <input type="file" id="avatar-input" accept="image/*" style="display:none;"
                                    onchange="uploadAvatar()">
                                <button type="button" onclick="document.getElementById('avatar-input').click()"
                                    style="background:#fff; border:1px solid #ccc; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">
                                    📷 Đổi ảnh đại diện
                                </button>
                                <p style="margin:5px 0 0; font-size:12px; color:#888;">Hỗ trợ JPG, PNG, WEBP</p>
                            </div>
                        </div>
                        <form onsubmit="updateUserInfo(); return false;" class="booking-form" style="max-width: 100%;">
                            <label for="u_name">Họ tên</label>
                            <input id="u_name" required>

                            <label for="u_email">Email</label>
                            <input id="u_email" type="email">

                            <label for="u_phone">Số điện thoại</label>
                            <input id="u_phone" required>

                            <button type="submit" style="margin-top: 15px;">Lưu thay đổi</button>
                        </form>

                        <!-- CHANGE PASSWORD SECTION -->
                        <h3 style="margin-top:30px; border-bottom:1px solid #eee; padding-bottom:10px;">Đổi Mật Khẩu
                        </h3>
                        <form onsubmit="changePassword(); return false;" class="booking-form" style="max-width: 100%;">
                            <label for="old_pass">Mật khẩu cũ</label>
                            <input type="password" id="old_pass" required placeholder="Nhập mật khẩu hiện tại">

                            <label for="new_pass">Mật khẩu mới (tối thiểu 6 ký tự)</label>
                            <input type="password" id="new_pass" required minlength="6" placeholder="Nhập mật khẩu mới">

                            <label for="confirm_pass">Nhập lại mật khẩu mới</label>
                            <input type="password" id="confirm_pass" required minlength="6"
                                placeholder="Xác nhận mật khẩu mới">

                            <button type="submit" style="margin-top: 15px; background-color: #555;">Đổi Mật
                                Khẩu</button>
                        </form>
                    </div>

                    <div id="tab-orders" class="tab-pane">
                        <h3 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">Lịch Sử Đơn Hàng
                        </h3>
                        <div id="order-history-list">Đang tải...</div>
                    </div>

                    <div id="tab-bookings" class="tab-pane">
                        <h3 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">Lịch Sử Đặt Bàn
                        </h3>
                        <div id="booking-history-list">Đang tải...</div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            © 2025 Nhà Hàng Cơm Quê Dượng Bầu
        </footer>

    </div>

    <!-- REVIEW MODAL -->
    <div id="review-modal" class="modal"
        style="display:none; position:fixed; z-index:1001; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
        <div class="modal-content"
            style="background-color:#fefefe; margin:auto; padding:24px; border:1px solid #888; width:90%; max-width:400px; border-radius:12px; position:relative; top: 10%;">
            <h3 style="margin-top:0;">Đánh giá đơn hàng</h3>
            <input type="hidden" id="review-order-id">

            <div style="margin:20px 0; text-align:center;">
                <label style="display:block; margin-bottom:10px;">Bạn cảm thấy thế nào?</label>
                <div class="star-rating" style="font-size:32px; color:#ddd; cursor:pointer;">
                    <span onclick="setRating(1)" data-value="1">★</span>
                    <span onclick="setRating(2)" data-value="2">★</span>
                    <span onclick="setRating(3)" data-value="3">★</span>
                    <span onclick="setRating(4)" data-value="4">★</span>
                    <span onclick="setRating(5)" data-value="5">★</span>
                </div>
                <input type="hidden" id="review-rating" value="0">
            </div>

            <div style="margin-bottom:20px;">
                <textarea id="review-comment" rows="4" placeholder="Viết nhận xét của bạn..."
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></textarea>
            </div>

            <div style="text-align:right; gap:10px; display:flex; justify-content:flex-end;">
                <button onclick="document.getElementById('review-modal').style.display='none'"
                    style="padding:10px 20px; background:#eee; border:none; border-radius:6px; cursor:pointer;">Đóng</button>
                <button onclick="submitReview()"
                    style="padding:10px 20px; background:#e67e22; color:white; border:none; border-radius:6px; cursor:pointer;">Gửi
                    đánh giá</button>
            </div>
        </div>
    </div>

    <!-- ORDER DETAIL MODAL -->
    <div id="order-detail-modal" class="modal"
        style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.5);">
        <div class="modal-content"
            style="background-color:#fefefe; margin:10% auto; padding:20px; border:1px solid #888; width:90%; max-width:600px; border-radius:8px;">
            <div
                style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                <h3 style="margin:0;">Chi Tiết Đơn Hàng #<span id="modal-order-id"></span></h3>
                <span class="close" onclick="closeOrderModal()"
                    style="font-size:28px; font-weight:bold; cursor:pointer;">&times;</span>
            </div>
            <div id="modal-order-items">
                <!-- Items will be loaded here -->
                <div class="spinner"></div> Đang tải...
            </div>
            <div style="text-align:right; margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
                <button onclick="closeOrderModal()"
                    style="padding:8px 16px; background:#ddd; border:none; border-radius:4px; cursor:pointer;">Đóng</button>
            </div>
        </div>
    </div>

    <!-- JS Modules (thứ tự nạp quan trọng: utils → payment → profile → reviews) -->
    <script src="js/utils.js?v=3.0"></script>
    <script src="js/payment.js?v=3.0"></script>
    <script src="js/profile.js?v=3.0"></script>
    <script src="js/reviews.js?v=3.0"></script>

    <script>
        // Init logic for profile page
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user) {
                alert('Bạn chưa đăng nhập!');
                window.location.href = 'index.html';
                return;
            }

            // Load tabs based on URL param
            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get('tab') || 'info';
            switchProfileTab(tab);

            // Initial Load
            loadUserProfile();
        });

        function logoutUser() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                fetch('api/auth/logout.php', { method: 'POST' })
                    .finally(() => {
                        localStorage.removeItem('restaurant_user');
                        window.location.href = 'index.html';
                    });
            }
        }
    </script>

</body>

</html>
